# Spring Application Properties
spring.application.name=auto-checker

# Server Configuration
server.port=9090

# Dynamic DataSource Configuration (SQLite local default, PostgreSQL on Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:scanner.db?journal_mode=WAL&busy_timeout=5000}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.sqlite.JDBC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.community.dialect.SQLiteDialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Multipart File Upload Configurations
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Custom Scanner Config — ABSOLUTE path so dirs always created in the right place
app.projects-dir=./Projects

# Async thread pool for background scans
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=3
spring.task.execution.pool.queue-capacity=10

# SSE timeout — keep connections alive for 30 minutes
spring.mvc.async.request-timeout=1800000

# Groq API Configurations
ai.provider=groq
groq.api.key=${GROQ_API_KEY:}
groq.model=llama-3.3-70b-versatile
groq.batch.size=50

# Parallel Crawling Configurations
crawler.parallel.enabled=true
crawler.parallel.workers=3

# Admin Panel Security Configuration
admin.security.pin=5555

# Single port consolidated mode (Unified Port 9090)
app.single-port=${APP_SINGLE_PORT:true}
